name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            food-classifier/requirements.txt
            food-web/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q food-classifier/src food-web tests
      - name: Regression tests without model downloads
        run: python -m pytest -q
      - name: Training and demo entry points
        run: |
          python food-classifier/src/train.py --help
          python food-classifier/src/evaluate.py --help
          python food-classifier/src/infer.py --help
          python food-classifier/src/app.py --help
