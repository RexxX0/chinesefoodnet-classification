# Repository tooling configuration; each application has its own requirements.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["food-web/bin", "data/raw", "data/processed", "logs", "outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["food-classifier/src", "food-web"]
